<nav class="vertical-sidebar">
    <div class="app-logo">
        <a class="logo d-inline-block" href="/app" title="{{ app_name }}">
            {% if app_logo %}
            <img alt="{{ app_name }}" src="{{ app_logo }}">
            {% else %}
            <span class="app-logo-initials">{{ app_name[:2]|upper }}</span>
            {% endif %}
        </a>
    </div>

    <div class="app-nav" id="app-simple-bar" data-simplebar>
        <ul class="main-nav p-0 mt-2">
            <li class="menu-title">
                <span>Workspace</span>
            </li>

            {% for page in pages %}
            <li>
                <a href="/app/{{ page.name | lower | replace(' ', '-') }}">
                    {% if page.custom_animated_icon %}
                    <span class="sidebar-item-icon">
                        <iconify-icon icon="line-md:{{ page.custom_animated_icon }}"></iconify-icon>
                    </span>
                    {% elif page.icon %}
                    <span class="sidebar-item-icon">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-{{ page.icon }}"></use></svg>
                    </span>
                    {% else %}
                    <span class="sidebar-item-icon">
                        <iconify-icon icon="line-md:arrow-small-right"></iconify-icon>
                    </span>
                    {% endif %}
                    <span class="sidebar-item-label">{{ page.title }}<span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</nav>
